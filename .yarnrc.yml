nodeLinker: node-modules

enableScripts: true

# @rufusmai/design-system comes from GitHub Packages; NPM_TOKEN is a GitHub
# token with read:packages (shell locally, environment variable on Vercel)
npmScopes:
  rufusmai:
    npmRegistryServer: 'https://npm.pkg.github.com'
    npmAuthToken: '${NPM_TOKEN:-}'
